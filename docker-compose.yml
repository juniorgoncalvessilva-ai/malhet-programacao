# Postgres para desenvolvimento. API e web rodam fora (ver README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: programacao
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro]
volumes:
  pgdata:
