[project]
name = "programacao-obra-api"
version = "0.1.0"
description = "API de programação diária de obra integrada ao Simova"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "python-multipart>=0.0.9",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
