<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Malhet Campo</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f7f6; color: #1f2a2a; }
    @media (prefers-color-scheme: dark) { body { background: #151b1b; color: #e6eeee; } }
    main { max-width: 320px; padding: 24px; text-align: center; }
    button { margin-top: 16px; height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #2f6f73; color: #fff; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Malhet Campo</h1>
    <p>Sem conexão com o servidor agora. Na primeira vez o app precisa de internet; depois as telas do campo abrem offline.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
