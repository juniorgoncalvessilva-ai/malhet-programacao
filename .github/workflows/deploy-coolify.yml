# A cada push em main: monta as imagens da API e do site AQUI (GitHub Actions, com cache) e publica no ghcr.io;
# depois dispara o deploy no Coolify, que só baixa as imagens (docker-compose.coolify.imagens.yml) — spec 085.
# Requer o secret do repositório COOLIFY_TOKEN (Settings › Secrets and variables › Actions).
name: Deploy no Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-coolify
  cancel-in-progress: false

jobs:
  imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nome: malhet-api
            contexto: apps/api
          - nome: malhet-web
            contexto: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Montar e publicar ${{ matrix.nome }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.nome }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.nome }}:${{ github.sha }}
          build-args: |
            API_INTERNAL_URL=http://api:8000
            NEXT_PUBLIC_VERSAO=${{ github.sha }}
            NEXT_PUBLIC_CONTATO_PRIVACIDADE=${{ vars.CONTATO_PRIVACIDADE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}

  deploy:
    needs: imagens
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL || 'http://179.199.156.129:8000' }}
      COOLIFY_UUID: ${{ vars.COOLIFY_UUID || 'zhailxjohc52ohmgm36jzdpp' }}
      APP_URL: ${{ vars.APP_URL || 'http://179.199.156.129:3000' }}
    steps:
      - name: Conferir o token
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Cadastre o secret COOLIFY_TOKEN em Settings › Secrets and variables › Actions."
            exit 1
          fi
      - name: Disparar o deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          status=$(curl -sS -m 60 -X POST -o resposta.json -w '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID&force=false")
          echo "HTTP $status"; cat resposta.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::O Coolify respondeu HTTP $status. Confira o token, o uuid do recurso e se a porta 8000 está aberta."
            exit 1
          fi
          dep=$(python3 -c 'import json;print(json.load(open("resposta.json"))["deployments"][0]["deployment_uuid"])')
          echo "DEPLOY_UUID=$dep" >> "$GITHUB_ENV"
          echo "Deploy $dep enfileirado."
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Acompanhar até o fim e testar a aplicação
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash .github/scripts/acompanhar-deploy.sh "$DEPLOY_UUID"
